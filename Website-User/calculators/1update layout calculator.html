<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Permission Calculator</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4293868711216722"
        crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .toggles {
            background-color: #e8f4f8;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 5px solid #3498db;
        }
        .toggles label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin: 12px 0;
            cursor: pointer;
            color: #2980b9;
        }
        .toggles input[type="checkbox"] {
            transform: scale(1.3);
            margin-right: 10px;
        }
        .toggles select {
            margin-top: 8px;
            display: block;
            width: 100%;
            max-width: 400px;
            padding: 8px;
            font-size: 15px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #34495e;
            color: white;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        input[type="number"] {
            width: 100px;
            padding: 6px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="number"]:disabled, select:disabled {
            background-color: #e9ecef;
            cursor: not-allowed;
            border-color: #ddd;
        }
        select {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #fff;
        }
        .total-col {
            background-color: #ecf0f1;
            font-weight: bold;
            color: #e74c3c;
            min-width: 100px;
        }
        .grand-total-row {
            background-color: #2c3e50;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
        }
        .grand-total-row td {
            border-color: #2c3e50;
        }
        .grand-total-val {
            color: #f1c40f;
        }
        .note {
            font-size: 0.85em;
            color: #7f8c8d;
            text-align: right;
            margin-top: 10px;
        }
        .sub-label {
            font-size: 0.75em;
            color: #7f8c8d;
            font-weight: normal;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Layout Permission Calculator</h2>
        
        <div class="toggles">
            <label>
                <input type="checkbox" id="is_cidco" onchange="calculate()"> 
                Check if this is a CIDCO Plot (Applies IDC Charge)
            </label>
            
            <label>
                <input type="checkbox" id="is_itor" onchange="calculate()"> 
                Check if conversion is Industrial to Residential (Applies I TO R Charge)
            </label>
            
            <label>
                Select Zone/Location (Determines NA Charge):
                <select id="zone_type" onchange="calculate()">
                    <option value="yellow">Yellow Zone (NA Not Applicable)</option>
                    <option value="green">Green Zone (NA Applies)</option>
                    <option value="1.5km">1.5km under Sambhaji Nagar (NA Applies)</option>
                    <option value="2km">2km under Sambhaji Nagar (NA Applies)</option>
                </select>
            </label>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Sr. no.</th>
                    <th>Type</th>
                    <th>Area in sq. mtr</th>
                    <th>ASR</th>
                    <th>%</th>
                    <th>FACTOR</th>
                    <th>TOTAL</th>
                </tr>
            </thead>
            <tbody>
                <!-- 1. LDC -->
                <tr>
                    <td>1</td>
                    <td><strong>LDC</strong></td>
                    <td><input type="number" id="area_ldc" oninput="calculate()" placeholder="Area"></td>
                    <td><input type="number" id="asr_ldc" oninput="calculate()" placeholder="ASR"></td>
                    <td>0.50%</td>
                    <td>
                        <select id="factor_ldc" onchange="calculate()">
                            <option value="1.0">1.0 RESI</option>
                            <option value="1.5">1.5 INDUS</option>
                            <option value="2.0">2.0 COMM</option>
                        </select>
                    </td>
                    <td class="total-col" id="total_ldc">0.00</td>
                </tr>
                
                <!-- 2. NA -->
                <tr>
                    <td>2</td>
                    <td>
                        <strong>NA</strong>
                        <span class="sub-label">(One Time Conversion Premium)</span>
                    </td>
                    <td><input type="number" id="area_na" oninput="calculate()" placeholder="Area" disabled></td>
                    <td><input type="number" id="asr_na" oninput="calculate()" placeholder="ASR" disabled></td>
                    <td>
                        <select id="pct_na" onchange="calculate()" disabled>
                            <option value="0.10">0.10%</option>
                            <option value="0.25">0.25%</option>
                            <option value="0.50">0.50%</option>
                        </select>
                    </td>
                    <td>1</td>
                    <td class="total-col" id="total_na">0.00</td>
                </tr>

                <!-- 3. IDC -->
                <tr>
                    <td>3</td>
                    <td><strong>IDC</strong></td>
                    <td><input type="number" id="area_idc" oninput="calculate()" placeholder="Area" disabled></td>
                    <td>120 (Fixed)</td>
                    <td>100%</td>
                    <td>1</td>
                    <td class="total-col" id="total_idc">0.00</td>
                </tr>

                <!-- 4. I TO R -->
                <tr>
                    <td>4</td>
                    <td><strong>I TO R</strong></td>
                    <td><input type="number" id="area_itor" oninput="calculate()" disabled placeholder="Area"></td>
                    <td><input type="number" id="asr_itor" oninput="calculate()" disabled placeholder="ASR"></td>
                    <td>2.5%</td>
                    <td>1</td>
                    <td class="total-col" id="total_itor">0.00</td>
                </tr>

                <!-- GRAND TOTAL -->
                <tr class="grand-total-row">
                    <td colspan="6" style="text-align: right; padding-right: 20px;">GRAND TOTAL:</td>
                    <td class="grand-total-val" id="grand_total">0.00</td>
                </tr>
            </tbody>
        </table>
        <div class="note">* Note: Formula used is Area × ASR × Percentage × Factor</div>
    </div>

    <script>
        // Trigger initial calculation to setup disabled states based on default selections
        window.onload = calculate;

        function calculate() {
            const getVal = (id) => parseFloat(document.getElementById(id).value) || 0;
            const setVal = (id, val) => document.getElementById(id).innerText = val.toFixed(2);

            const isCidco = document.getElementById('is_cidco').checked;
            const isItor = document.getElementById('is_itor').checked;
            const zoneType = document.getElementById('zone_type').value;
            
            // NA is only applicable if the zone is NOT yellow
            const isNaApplicable = (zoneType !== 'yellow');

            // Enable/Disable inputs for IDC based on CIDCO checkbox
            document.getElementById('area_idc').disabled = !isCidco;

            // Enable/Disable inputs for I TO R based on checkbox
            document.getElementById('area_itor').disabled = !isItor;
            document.getElementById('asr_itor').disabled = !isItor;

            // Enable/Disable inputs for NA based on zone selection
            document.getElementById('area_na').disabled = !isNaApplicable;
            document.getElementById('asr_na').disabled = !isNaApplicable;
            document.getElementById('pct_na').disabled = !isNaApplicable;

            let grandTotal = 0;

            // 1. LDC: Area * ASR * 0.50% * Factor
            let ldc = getVal('area_ldc') * getVal('asr_ldc') * (0.50 / 100) * parseFloat(document.getElementById('factor_ldc').value);
            setVal('total_ldc', ldc);
            grandTotal += ldc;

            // 2. NA (One Time Conversion Premium): Area * ASR * (0.10% or 0.25% or 0.50%) * 1
            let na = 0;
            if (isNaApplicable) {
                let naPct = parseFloat(document.getElementById('pct_na').value);
                na = getVal('area_na') * getVal('asr_na') * (naPct / 100) * 1;
            }
            setVal('total_na', na);
            grandTotal += na;

            // 3. IDC: Area * 120 * 100% * 1 (Applies only if CIDCO plot is checked)
            let idc = 0;
            if (isCidco) {
                idc = getVal('area_idc') * 120 * (100 / 100) * 1;
            }
            setVal('total_idc', idc);
            grandTotal += idc;

            // 4. I TO R: Area * ASR * 2.5% * 1 (Applies only if checked)
            let itor = 0;
            if (isItor) {
                itor = getVal('area_itor') * getVal('asr_itor') * (2.5 / 100) * 1;
            }
            setVal('total_itor', itor);
            grandTotal += itor;

            // Update Grand Total
            setVal('grand_total', grandTotal);
        }
    </script>
</body>
</html>
